plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.recordingcamera.core'
    compileSdk 36
    // 35.0.0 is an empty stub in this SDK installation; 36.1.0 is the installed, complete one.
    buildToolsVersion '36.1.0'

    defaultConfig {
        minSdk 24
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    def camerax = '1.5.3'

    // CameraX is part of the public surface (Preview.SurfaceProvider, LifecycleOwner binding,
    // VideoRecordEvent), so the camera artifacts are exposed as `api`.
    api "androidx.camera:camera-core:$camerax"
    api "androidx.camera:camera-camera2:$camerax"
    api "androidx.camera:camera-lifecycle:$camerax"
    api "androidx.camera:camera-video:$camerax"

    implementation "androidx.camera:camera-extensions:$camerax"

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-common:2.8.4'
    implementation 'androidx.annotation:annotation:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}
